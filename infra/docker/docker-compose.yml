version: '3.9'

services:
  ml-service:
    build: ../../ml-services/project-1-ml
    container_name: ml-service
    ports:
      - "8000:8000"
    volumes:
      - ../../ml-services/project-1-ml:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  backend:
    build: ../../backend
    container_name: backend
    ports:
      - "3000:3000"
    volumes:
      - ../../backend:/app
      - /app/node_modules
    depends_on:
      - ml-service
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
    command: npm run dev
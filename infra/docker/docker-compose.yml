services:
  ml-service:
    build:
      context: ../../ml-services/main-service
      dockerfile: Dockerfile
    container_name: ml-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    volumes:
      - ../../backend:/app
      - /app/node_modules
    depends_on:
      - ml-service
    environment:
      - NODE_ENV=development
      - PORT=3000
      - ML_SERVICE_URL=http://ml-service:8000
    command: npm run dev

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3001:3001"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:3000
    command: npm run dev